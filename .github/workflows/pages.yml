name: Deploy GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack approved production protagonist frames R2
        run: |
          set -euo pipefail
          rm -rf assets/v05/production58
          mkdir -p assets/v05/production58
          unzip -q -o Darkbound_Approved_Production_Sprites_R2.zip -d assets/v05/production58
          test -f assets/v05/production58/manifest.json

      - name: Inspect PixelLab protagonist archive
        run: |
          set -euo pipefail
          echo '--- PixelLab archive listing ---'
          unzip -Z1 'Protagonist production sprites.zip'
          echo '--- end listing ---'
          exit 1

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
