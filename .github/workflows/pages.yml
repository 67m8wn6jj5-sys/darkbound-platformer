name: Deploy GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack approved production protagonist frames R2
        run: |
          set -euo pipefail
          rm -rf assets/v05/production58
          mkdir -p assets/v05/production58
          unzip -q -o Darkbound_Approved_Production_Sprites_R2.zip -d assets/v05/production58
          test -f assets/v05/production58/manifest.json
          test "$(find assets/v05/production58 -type f -name '*.png' | wc -l)" -eq 47
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('assets/v05/production58/manifest.json').read_text())
          assert data['canvas']=='512x512 RGBA transparent'
          expected={'idle':6,'run':6,'jump':4,'attack':8,'dodge':8,'hurt':7,'death':8}
          assert data['actions']==expected
          assert sum(expected.values())==47
          assert data.get('revision')=='R2 - corrected RUN frames'
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
