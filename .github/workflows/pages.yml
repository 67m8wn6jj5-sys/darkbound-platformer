name: Deploy GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack approved fallback protagonist frames R2
        run: |
          set -euo pipefail
          rm -rf assets/v05/production58
          mkdir -p assets/v05/production58
          unzip -q -o Darkbound_Approved_Production_Sprites_R2.zip -d assets/v05/production58
          test -f assets/v05/production58/manifest.json

      - name: Normalize PixelLab protagonist animation frames
        run: |
          set -euo pipefail
          rm -rf .pixellab-unpack assets/v05/pixellab_protagonist
          mkdir -p .pixellab-unpack assets/v05/pixellab_protagonist
          unzip -q -o 'Protagonist production sprites.zip' -d .pixellab-unpack
          python - <<'PY'
          from pathlib import Path
          import shutil, re, json
          root=Path('.pixellab-unpack'); out=Path('assets/v05/pixellab_protagonist')
          action_markers={'idle':'dark-fantasy-Idle','run':'dark-fantasy-Sprinting','jump':'dark-fantasy-Jump','fall':'dark-fantasy-Falling','light_attack':'dark-fantasy-Light_Sword_attack','heavy_attack':'dark-fantasy-Heavy_sword_attack','dash':'dark-fantasy-Dash','hit':'dark-fantasy-Hit_knocked_back','death':'dark-fantasy-Death'}
          manifest={}
          for action,marker in action_markers.items():
              manifest[action]={}
              candidates=[p for p in root.rglob('frame_*.png') if '__MACOSX' not in p.parts and marker.lower() in str(p).lower()]
              if not candidates: raise SystemExit(f'No frames found for {action}')
              for direction in ('east','west'):
                  frames=[p for p in candidates if direction in [part.lower() for part in p.parts]]
                  frames.sort(key=lambda p:int(re.search(r'frame_(\d+)',p.stem).group(1)))
                  if not frames: raise SystemExit(f'No {direction} frames found for {action}')
                  dest=out/action/direction; dest.mkdir(parents=True,exist_ok=True)
                  for i,p in enumerate(frames): shutil.copy2(p,dest/f'frame_{i:03d}.png')
                  manifest[action][direction]=len(frames)
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2))
          Path('src/pixellabManifest.js').write_text('export const PIXELLAB_MANIFEST = '+json.dumps(manifest,separators=(',',':'))+';\n')
          PY

      - name: Normalize Enemy 1 PixelLab frames
        run: |
          set -euo pipefail
          rm -rf .enemy1-unpack assets/v05/enemy1
          mkdir -p .enemy1-unpack assets/v05/enemy1
          unzip -q -o 'Enemy 1.zip' -d .enemy1-unpack
          python - <<'PY'
          from pathlib import Path
          import shutil, re, json
          root=Path('.enemy1-unpack'); out=Path('assets/v05/enemy1')
          frames=[p for p in root.rglob('frame_*.png') if '__MACOSX' not in p.parts]
          if not frames: raise SystemExit('Enemy 1.zip contains no frame_*.png files')
          def classify(p):
              s=str(p).lower().replace('-','_').replace(' ','_')
              if 'lunge' in s or 'attack' in s: return 'lunge'
              if 'death' in s or 'dead' in s: return 'death'
              if 'hit' in s or 'knock' in s or 'hurt' in s: return 'hit'
              if 'idle' in s or 'walk' in s: return 'patrol'
              return None
          manifest={}
          for action in ('patrol','lunge','hit','death'):
              picked=[p for p in frames if classify(p)==action]
              if not picked: continue
              manifest[action]={}
              bydir={}
              for direction in ('east','west'):
                  seq=[p for p in picked if direction in [part.lower() for part in p.parts] or direction in p.name.lower()]
                  seq.sort(key=lambda p:(str(p.parent),int(re.search(r'frame_(\d+)',p.stem).group(1))))
                  bydir[direction]=seq
              if not bydir['east'] and not bydir['west']: continue
              if not bydir['east']:
                  bydir['east']=bydir['west']; manifest[action]['mirrorEast']=True
              if not bydir['west']:
                  bydir['west']=bydir['east']; manifest[action]['mirrorWest']=True
              for direction in ('east','west'):
                  dest=out/action/direction; dest.mkdir(parents=True,exist_ok=True)
                  for i,p in enumerate(bydir[direction]): shutil.copy2(p,dest/f'frame_{i:03d}.png')
                  manifest[action][direction]=len(bydir[direction])
          for required in ('patrol','lunge'):
              if required not in manifest: raise SystemExit(f'Could not identify Enemy 1 {required} frames')
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2))
          Path('src/enemy1Manifest.js').write_text('export const ENEMY1_MANIFEST = '+json.dumps(manifest,separators=(',',':'))+';\n')
          PY

      - name: Normalize Enemy 2 troll and sling rock
        run: |
          set -euo pipefail
          rm -rf .enemy2-unpack assets/v05/enemy2
          mkdir -p .enemy2-unpack assets/v05/enemy2
          unzip -q -o 'Enemy 2 .zip' -d .enemy2-unpack
          python - <<'PY'
          from pathlib import Path
          import shutil, re, json
          root=Path('.enemy2-unpack'); out=Path('assets/v05/enemy2')
          pngs=[p for p in root.rglob('*.png') if '__MACOSX' not in p.parts]
          if not pngs: raise SystemExit('Enemy 2 archive contains no PNG assets')
          def norm(p): return str(p).lower().replace('-','_').replace(' ','_')
          def action(p):
              s=norm(p)
              if 'rock' in s or 'stone' in s or 'projectile' in s: return 'rock'
              if 'death' in s or 'dead' in s: return 'death'
              if 'hit' in s or 'hurt' in s or 'knock' in s: return 'hit'
              if 'sling' in s or 'throw' in s or 'attack' in s or 'shoot' in s: return 'attack'
              if 'idle' in s or 'walk' in s or 'run' in s: return 'patrol'
              return None
          manifest={}
          rocks=[p for p in pngs if action(p)=='rock']
          if not rocks: raise SystemExit('Could not identify Enemy 2 rock asset')
          rock=rocks[0]; (out/'rock').mkdir(parents=True,exist_ok=True); shutil.copy2(rock,out/'rock/rock.png')
          manifest['rock']='rock/rock.png'
          for a in ('patrol','attack','hit','death'):
              picked=[p for p in pngs if action(p)==a]
              if not picked: continue
              manifest[a]={}; bydir={}
              for d in ('east','west'):
                  seq=[p for p in picked if d in norm(p)]
                  seq.sort(key=lambda p:(str(p.parent), int(re.search(r'(\d+)',p.stem).group(1)) if re.search(r'(\d+)',p.stem) else 0))
                  bydir[d]=seq
              if not bydir['east'] and not bydir['west']:
                  bydir['east']=picked; bydir['east'].sort(key=str)
              if not bydir['east']: bydir['east']=bydir['west']; manifest[a]['mirrorEast']=True
              if not bydir['west']: bydir['west']=bydir['east']; manifest[a]['mirrorWest']=True
              for d in ('east','west'):
                  dest=out/a/d; dest.mkdir(parents=True,exist_ok=True)
                  for i,p in enumerate(bydir[d]): shutil.copy2(p,dest/f'frame_{i:03d}.png')
                  manifest[a][d]=len(bydir[d])
          for required in ('patrol','attack'):
              if required not in manifest: raise SystemExit(f'Could not identify Enemy 2 {required} frames; files: {[str(p) for p in pngs]}')
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2))
          Path('src/enemy2Manifest.js').write_text('export const ENEMY2_MANIFEST = '+json.dumps(manifest,separators=(',',':'))+';\n')
          print(json.dumps(manifest,indent=2))
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
