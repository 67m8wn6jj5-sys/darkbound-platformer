name: Deploy GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore clean protagonist animation PNGs
        run: |
          set -euo pipefail
          rm -rf assets/v05/animations
          mkdir -p assets/v05/animations
          cat assets/v05/bundle/chunk_* | base64 --decode > /tmp/v05-animations.tgz
          tar -xzf /tmp/v05-animations.tgz -C assets/v05/animations
          test "$(find assets/v05/animations -maxdepth 1 -name '*.png' | wc -l)" -eq 9
          file assets/v05/animations/*.png

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
