name: Deploy GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack v0.5.8 R4 production protagonist frames
        run: |
          set -euo pipefail
          rm -rf assets/v05/production58
          mkdir -p assets/v05/production58
          unzip -q -o Darkbound_v0.5.8_Production_Sprites_R4_JumpReplacement.zip -d assets/v05/production58
          test -f assets/v05/production58/manifest.json
          test "$(find assets/v05/production58 -type f -name '*.png' | wc -l)" -eq 54
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('assets/v05/production58/manifest.json').read_text())
          assert data['version']=='v0.5.8-cleanup-r4-jump-replacement'
          assert data['canvas']==[512,512]
          assert sum(v['frames'] for v in data['sequences'].values())==54
          assert data['sequences']['jump']['frames']==4
          assert data['sequences']['idle']['runtime_frames']==[1]
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
