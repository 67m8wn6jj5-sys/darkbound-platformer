name: Verify Protagonist Animation System

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize definitive production protagonist
        run: |
          set -euo pipefail
          python scripts/normalize_protagonist.py

      - name: Verify complete artwork and manifest coverage
        run: |
          set -euo pipefail
          python scripts/verify_protagonist.py

      - name: Parse-check JavaScript modules
        run: |
          set -euo pipefail
          for file in src/*.js; do
            node --check "$file"
          done

      - name: Verify protagonist state priority, turning, and combat frame sync
        run: |
          set -euo pipefail
          node --experimental-default-type=module scripts/verify_protagonist_logic.mjs

      - name: Reject stale live protagonist references
        run: |
          set -euo pipefail
          if grep -nE 'px-update4|protagonist-update-[0-9]|Protagonist update\.zip|Protagonist sprite updates\.zip|production58|FALLBACK_ASSET_ROOT|FALLBACK_SEQUENCES|fallbackKey' \
            src/GameSceneV05.js src/GameSceneV17.js scripts/normalize_protagonist.py .github/workflows/pages.yml; then
            echo 'Found stale live protagonist integration reference.' >&2
            exit 1
          fi

      - name: Static launch smoke test
        run: |
          set -euo pipefail

          # Enemy/boss manifests are generated by the Pages build and are not
          # checked into source control. Provide test-only empty modules so the
          # live GameSceneV17 inheritance chain can load in a browser here.
          test -f src/enemy1Manifest.js || printf 'export const ENEMY1_MANIFEST = {};\n' > src/enemy1Manifest.js
          test -f src/enemy2Manifest.js || printf 'export const ENEMY2_MANIFEST = {};\n' > src/enemy2Manifest.js
          test -f src/boss1Manifest.js || printf 'export const BOSS1_MANIFEST = {};\n' > src/boss1Manifest.js

          PORT=8765
          python -m http.server "$PORT" --bind 127.0.0.1 >/tmp/darkbound-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          READY=0
          for i in {1..40}; do
            if curl -fsS "http://127.0.0.1:$PORT/index.html" >/tmp/index.html; then READY=1; break; fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then break; fi
            sleep .25
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/darkbound-http.log || true
            exit 1
          fi
          test -s /tmp/index.html
          curl -fsS "http://127.0.0.1:$PORT/src/main.js" >/tmp/main.js
          curl -fsS "http://127.0.0.1:$PORT/src/GameSceneV17.js" >/tmp/v17.js
          curl -fsS "http://127.0.0.1:$PORT/src/pixellabManifest.js" >/tmp/protagonist-manifest.js
          curl -fsS "http://127.0.0.1:$PORT/assets/v05/pixellab_protagonist/idle/east/frame_000.png" >/tmp/idle.png
          curl -fsS "http://127.0.0.1:$PORT/assets/v05/pixellab_protagonist/run/rotations/south.png" >/tmp/turn.png

          CHROME=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then CHROME="$candidate"; break; fi
          done
          if [ -z "$CHROME" ]; then
            echo 'HTTP launch smoke passed; no Chrome/Chromium binary is installed on this runner.'
            exit 0
          fi

          if ! "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage \
            --enable-unsafe-swiftshader --window-size=1280,720 \
            --virtual-time-budget=5000 --dump-dom \
            "http://127.0.0.1:$PORT/index.html" >/tmp/darkbound-dom.html 2>/tmp/darkbound-chrome.log; then
            cat /tmp/darkbound-chrome.log || true
            exit 1
          fi
          if ! grep -q '<canvas' /tmp/darkbound-dom.html; then
            cat /tmp/darkbound-chrome.log || true
            cat /tmp/darkbound-dom.html || true
            exit 1
          fi
          echo "Browser launch smoke passed with $CHROME."
