name: Verify Protagonist Animation System

on:
  push:
    branches: [protagonist-animation-system]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize definitive production protagonist
        run: |
          set -euo pipefail
          python scripts/normalize_protagonist.py

      - name: Verify complete artwork and manifest coverage
        run: |
          set -euo pipefail
          python scripts/verify_protagonist.py

      - name: Parse-check JavaScript modules
        run: |
          set -euo pipefail
          for file in src/*.js; do
            node --check "$file"
          done

      - name: Reject stale live protagonist references
        run: |
          set -euo pipefail
          if grep -nE 'px-update4|protagonist-update-[0-9]|Protagonist update\.zip|Protagonist sprite updates\.zip' \
            src/GameSceneV17.js scripts/normalize_protagonist.py; then
            echo 'Found stale protagonist integration reference.' >&2
            exit 1
          fi

      - name: Static launch smoke test
        run: |
          set -euo pipefail
          python -m http.server 4173 >/tmp/darkbound-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/tmp/index.html; then break; fi
            sleep .25
          done
          test -s /tmp/index.html
          curl -fsS http://127.0.0.1:4173/src/main.js >/tmp/main.js
          curl -fsS http://127.0.0.1:4173/src/GameSceneV17.js >/tmp/v17.js
          curl -fsS http://127.0.0.1:4173/src/pixellabManifest.js >/tmp/protagonist-manifest.js
          curl -fsS http://127.0.0.1:4173/assets/v05/pixellab_protagonist/idle/east/frame_000.png >/tmp/idle.png
          curl -fsS http://127.0.0.1:4173/assets/v05/pixellab_protagonist/run/rotations/south.png >/tmp/turn.png

          CHROME=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then CHROME="$candidate"; break; fi
          done
          if [ -z "$CHROME" ]; then
            echo 'No Chrome/Chromium binary on runner; HTTP launch smoke passed, browser smoke skipped.'
            exit 0
          fi

          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --window-size=1280,720 --virtual-time-budget=5000 --dump-dom \
            http://127.0.0.1:4173/index.html >/tmp/darkbound-dom.html 2>/tmp/darkbound-chrome.log
          grep -q '<canvas' /tmp/darkbound-dom.html
          echo "Browser launch smoke passed with $CHROME."
