name: Verify Protagonist, Combat, and Environment Systems

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize definitive production protagonist
        run: |
          set -euo pipefail
          python scripts/normalize_protagonist.py

      - name: Verify complete artwork and manifest coverage
        run: |
          set -euo pipefail
          python scripts/verify_protagonist.py

      - name: Parse-check JavaScript modules
        run: |
          set -euo pipefail
          for file in src/*.js; do node --check "$file"; done

      - name: Verify protagonist state priority, turning, and combat frame sync
        run: |
          set -euo pipefail
          node --experimental-default-type=module scripts/verify_protagonist_logic.mjs

      - name: Verify today-only sword combo and visual timing
        run: |
          set -euo pipefail
          node --experimental-default-type=module scripts/verify_protagonist_v18.mjs

      - name: Verify sword cycling and per-attack VFX V25
        run: |
          set -euo pipefail
          node --experimental-default-type=module scripts/verify_sword_presentation_v25.mjs

      - name: Verify Combat Feel and Enemy Intelligence Pass 1
        run: node --experimental-default-type=module scripts/verify_combat_v19.mjs

      - name: Verify Combat Fairness and Damage Feedback Pass 2
        run: node --experimental-default-type=module scripts/verify_combat_v20.mjs

      - name: Verify sword priority over melee charges
        run: node --experimental-default-type=module scripts/verify_combat_v21.mjs

      - name: Verify Procedural Gothic Ruins environment
        run: node --experimental-default-type=module scripts/verify_environment_v22.mjs

      - name: Verify Playable Procedural Level Design
        run: node --experimental-default-type=module scripts/verify_level_design_v23.mjs

      - name: Verify Expanded Stage Flow
        run: node --experimental-default-type=module scripts/verify_stage_flow_v24.mjs

      - name: Reject stale live protagonist references
        run: |
          set -euo pipefail
          if grep -nE 'px-update4|protagonist-update-[0-9]|Protagonist sprite updates\.zip|production58|FALLBACK_ASSET_ROOT|FALLBACK_SEQUENCES|fallbackKey|attack_alt' \
            src/GameSceneV17.js src/GameSceneV18.js src/GameSceneV19.js src/GameSceneV20.js src/GameSceneV21.js src/GameSceneV22.js src/GameSceneV23.js src/GameSceneV24.js src/GameSceneV25.js; then
            echo 'Found a stale live protagonist/attack reference.' >&2
            exit 1
          fi
          if grep -nE 'Protagonist update\.zip' \
            src/GameSceneV05.js src/GameSceneV17.js src/GameSceneV18.js src/GameSceneV19.js src/GameSceneV20.js src/GameSceneV21.js src/GameSceneV22.js src/GameSceneV23.js src/GameSceneV24.js src/GameSceneV25.js .github/workflows/pages.yml; then
            echo 'Old attack archive leaked into live runtime/deploy references.' >&2
            exit 1
          fi

      - name: Static launch smoke test
        run: |
          set -euo pipefail
          test -f src/enemy1Manifest.js || printf 'export const ENEMY1_MANIFEST = {};\n' > src/enemy1Manifest.js
          test -f src/enemy2Manifest.js || printf 'export const ENEMY2_MANIFEST = {};\n' > src/enemy2Manifest.js
          test -f src/boss1Manifest.js || printf 'export const BOSS1_MANIFEST = {};\n' > src/boss1Manifest.js

          PORT=8765
          python -m http.server "$PORT" --bind 127.0.0.1 >/tmp/darkbound-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          READY=0
          for i in {1..40}; do
            if curl -fsS "http://127.0.0.1:$PORT/index.html" >/tmp/index.html; then READY=1; break; fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then break; fi
            sleep .25
          done
          test "$READY" -eq 1
          curl -fsS "http://127.0.0.1:$PORT/src/main.js" >/tmp/main.js
          curl -fsS "http://127.0.0.1:$PORT/src/GameSceneV24.js" >/tmp/v24.js
          curl -fsS "http://127.0.0.1:$PORT/src/GameSceneV25.js" >/tmp/v25.js
          curl -fsS "http://127.0.0.1:$PORT/src/pixellabManifest.js" >/tmp/protagonist-manifest.js
          curl -fsS "http://127.0.0.1:$PORT/assets/v05/pixellab_protagonist/attack_1/east/frame_000.png" >/tmp/attack1.png
          curl -fsS "http://127.0.0.1:$PORT/assets/v05/pixellab_protagonist/attack_2/east/frame_000.png" >/tmp/attack2.png
          curl -fsS "http://127.0.0.1:$PORT/assets/v05/pixellab_protagonist/attack_3/east/frame_000.png" >/tmp/attack3.png
          curl -fsS "http://127.0.0.1:$PORT/pixellab-tileset-ancient-dark-gothic-stone-masonry-large-a89e3ba5.png" >/tmp/gothic-terrain.png
          test -s /tmp/attack1.png -a -s /tmp/attack2.png -a -s /tmp/attack3.png -a -s /tmp/gothic-terrain.png -a -s /tmp/v25.js

          CHROME=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then CHROME="$candidate"; break; fi
          done
          if [ -z "$CHROME" ]; then
            echo 'HTTP launch smoke passed; no Chrome/Chromium binary is installed.'
            exit 0
          fi
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage \
            --enable-unsafe-swiftshader --window-size=1280,720 \
            --virtual-time-budget=5000 --dump-dom \
            "http://127.0.0.1:$PORT/index.html?seed=42" >/tmp/darkbound-dom.html 2>/tmp/darkbound-chrome.log
          grep -q '<canvas' /tmp/darkbound-dom.html
          echo "Browser launch smoke passed with $CHROME."
