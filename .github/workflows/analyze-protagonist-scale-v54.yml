name: Analyze protagonist scale V54

on:
  push:
    branches: [main]
    paths:
      - 'scripts/analyze_protagonist_scale_v54.py'
      - '.github/workflows/analyze-protagonist-scale-v54.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow
      - name: Measure protagonist frame anatomy
        run: python scripts/analyze_protagonist_scale_v54.py
