name: Apply V05 Protagonist Cleanup

on:
  push:
    branches:
      - protagonist-animation-system

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: protagonist-animation-system
      - name: Apply cleanup
        run: python scripts/cleanup_v05_protagonist.py
      - name: Commit V05 cleanup
        run: |
          if git diff --quiet -- src/GameSceneV05.js; then
            echo "V05 cleanup already applied."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/GameSceneV05.js
          git commit -m 'Remove obsolete protagonist fallback loading'
          git push origin HEAD:protagonist-animation-system
