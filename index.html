<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#070910" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Darkbound Platformer v0.1.2</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main id="game-shell">
    <div id="game"></div>

    <div id="startup-error" hidden role="alert">
      <div class="error-card">
        <strong>Darkbound could not start</strong>
        <span data-error-message>Unknown startup error.</span>
        <small>Reload this page. If the message remains, send a screenshot.</small>
      </div>
    </div>

    <div id="rotate-overlay" aria-hidden="true">
      <div class="rotate-card">
        <div class="phone-icon">↻</div>
        <strong>Rotate your phone</strong>
        <span>Darkbound is designed for landscape play.</span>
      </div>
    </div>
  </main>

  <div style="position:fixed;left:50%;bottom:3px;transform:translateX(-50%);z-index:99999;font:10px/1 monospace;color:#9aa3b5;opacity:.45;pointer-events:none">V43</div>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js" crossorigin="anonymous"></script>
  <script type="module" src="./src/main.js?v=v43-dom-renderer-20260824-1"></script>
</body>
</html>
